name: Build AAB
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Decode keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > $RUNNER_TEMP/upload.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ vars.VERSION_CODE }}
        run: gradle :app:bundleRelease :app:assembleRelease :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: azkark-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
      - name: Publish AAB to builds branch
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/bundle/release/*.aab /tmp/out/app-release-unsigned.aab
          cp app/build/outputs/apk/debug/*.apk /tmp/out/app-debug.apk
          cd /tmp/out && git init -q -b builds && git add . \
            && git -c user.name=ci -c user.email=ci@local commit -qm "build ${GITHUB_SHA}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" builds
